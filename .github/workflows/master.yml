name: Docker CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kinetic-proxy:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kinetic-proxy:${{ github.sha }}
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }} &&
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kinetic-proxy:latest &&
            docker stop kinetic-proxy || true &&
            docker rm kinetic-proxy || true &&
            docker run -d \
            --name kinetic-proxy \
            --restart unless-stopped \
            --network host \
            -v /etc/letsencrypt:/etc/letsencrypt:ro \
            -v /etc/ssl/ulalaapi.store:/etc/ssl/ulalaapi.store:ro \
            ${{ secrets.DOCKERHUB_USERNAME }}/kinetic-proxy:latest
