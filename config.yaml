# pingora — konfigurasi produksi ulala.space + ulalaapi.store

# ── IMPORTANT FOR DOCKER ──────────────────────────────────────────────────────
daemon: false # <<<<< HARUS ADA UNTUK CONTAINER!

# ── Listener ──────────────────────────────────────────────────────────────────
listen_addr: "0.0.0.0:443"
http_redirect_addr: "0.0.0.0:80" # redirect HTTP → HTTPS

# ── Domain ────────────────────────────────────────────────────────────────────
web_domain: "ulala.space" # SPA Leptos
api_domain: "ulalaapi.store" # REST + WS + Image

# ── Upstream services ─────────────────────────────────────────────────────────
# CATATAN ARSITEKTUR: app e-ticketing kini UNIFIED — satu binary Leptos SSR yang
# melayani SSR + REST (/api/*, /api/live, /api/rtc) + WebSocket (/ws/*) sekaligus
# di port 3100 (docker -p 3100:3000). TIDAK ada service Axum terpisah di :8080.
# Karena itu backend_addr HARUS menunjuk ke app yang sama (3100), bukan 8080 yang
# mati — kalau tidak, route /api/* & /ws/* ke Backend akan connection-refused
# (circuit breaker 8080 di log naik s/d 10k+ failures). Kalau nanti REST dipisah
# ke service Axum sendiri, kembalikan ke 127.0.0.1:8080 dan jalankan service itu.
backend_addr: "127.0.0.1:3100" # unified: sama dengan app SSR (dulu :8080 Axum terpisah — sudah tidak ada)
frontend_addr: "127.0.0.1:3100" # Leptos SSR (docker -p 3100:3000)

# ── PPM AFM (app Leptos SSR terpisah) ─────────────────────────────────────────
# ppm-afm.com (+ www.) → 127.0.0.1:3200… Semua path (SSR + /api-fn + /pkg +
# /api/rfid + SSE) di-proxy ke app ppm. KOSONGKAN ppm_domain untuk menonaktifkan
# (ulala.space tak terpengaruh).
#
# Domain UTAMA punya cert sendiri (tls_cert_ppm di bawah) karena ppm-afm.com
# bukan subdomain ulala.space — ia tak bisa menumpang SAN cert web.
# ppm.ulala.space dipertahankan sebagai ALIAS: certnya sudah ada di cert web,
# jadi ia jatuh ke fallthrough SNI seperti sebelumnya dan tautan lama tak mati.
#
# CATATAN CLOUDFLARE: ppm-afm.com memakai NS Cloudflare (proxied). Cloudflare
# menyambung ke origin ini lewat :443 dengan SNI ppm-afm.com — karena itu cert
# di bawah harus benar-benar terpasang, bukan sekadar cert web.
ppm_domain: "ppm-afm.com"
ppm_domains:
  - "ppm.ulala.space"

# Satu instans (dipakai bila ppm_addrs kosong).
ppm_addr: "127.0.0.1:3200"

# LOAD BALANCER app ppm — round-robin + circuit breaker per alamat.
# Rencana 2–3 container: 3200, 3201, 3202 (docker -p 320X:3000).
#
# JANGAN membuka baris 3201/3202 sebelum containernya benar-benar jalan.
# Alamat mati tetap kebagian giliran, dan satu request hanya dapat SATU retry
# (proxy/mod.rs fail_to_connect) — dua alamat mati dari tiga berarti sebagian
# pengunjung menerima 502 sampai circuit breaker-nya membuka (5 kegagalan,
# cooldown 30 detik). Nyalakan containernya dulu, baru hapus komentarnya.
ppm_addrs:
  - "127.0.0.1:3200"
  - "127.0.0.1:3201"
  - "127.0.0.1:3202"
image_addr: "127.0.0.1:3902" # Garage S3 web UI
rustfs_ui_address: "127.0.0.1:9001"
rustfs_s3_address: "127.0.0.1:9000"

# ── Host tambahan di domain PPM ───────────────────────────────────────────────
# Host PENUH, bukan awalannya — memindahkannya ke domain lain cukup mengubah
# baris ini. Kosongkan untuk menonaktifkan (rulenya tak pernah cocok).
#
# WAJIB DILAKUKAN DI LUAR KODE sebelum ketiganya berfungsi:
#   1. DNS  — arahkan ketiga nama ke IP server ini (A record). Bila ppm-afm.com
#             memakai Cloudflare proxied, subdomainnya harus proxied juga.
#   2. CERT — HTTP-01 tidak bisa wildcard, jadi tiap nama disebut eksplisit:
#             certbot certonly --standalone --expand \
#               -d ppm-afm.com -d www.ppm-afm.com \
#               -d wa-admin.ppm-afm.com -d image-s3.ppm-afm.com -d ui-s3.ppm-afm.com
#             (hook pre/post yang sudah ada membebaskan :80 & menyalakan proxy lagi)
#
# Panel admin WhatsApp — app terpisah di :3000.
wa_admin_domain: "wa-admin.ppm-afm.com"
wa_admin_addr: "127.0.0.1:3000"

# Nama host KEDUA untuk RustFS yang SAMA (rustfs_s3_address / rustfs_ui_address
# di atas) — bukan instans baru. Gunanya supaya aplikasi di domain ppm-afm.com
# tak perlu menyebut ulalaapi.store untuk mengambil berkasnya sendiri.
image_s3_subdomain: "image-s3.ppm-afm.com" # → :9000 (S3 API)
ui_s3_subdomain: "ui-s3.ppm-afm.com" # → :9001 (console)
# ── Mode Deploy Frontend (pilih salah satu) ───────────────────────────────────
# MODE A (aktif): Proxy ke static-web-server :3100
#   WASM MIME dipastikan benar oleh proxy layer (application/wasm).
#
# MODE B: Serve langsung dari disk — uncomment baris ini, isi path ke dist Leptos
# frontend_dist_path: "/path/to/leptos/dist"
# ── TLS (Let's Encrypt) ───────────────────────────────────────────────────────
tls_cert_web: "/etc/letsencrypt/live/ulala.space/fullchain.pem"
tls_key_web: "/etc/letsencrypt/live/ulala.space/privkey.pem"
# PENTING: pakai path letsencrypt, JANGAN /etc/ssl/ulalaapi.store (cert ZeroSSL
# manual). Cert manual itu tidak pernah ikut diperbarui certbot → 3 Agu 2026
# kedaluwarsa diam-diam dan seluruh ulalaapi.store mati. Dengan path live/ di
# bawah, hasil `certbot renew` langsung terpakai. Cert mencakup SAN:
# ulalaapi.store, www., image., ui. (HTTP-01 tak bisa wildcard — tambah -d baru
# via `certbot certonly --standalone --expand -d ...` bila ada subdomain lain).
tls_cert_api: "/etc/letsencrypt/live/ulalaapi.store/fullchain.pem"
tls_key_api: "/etc/letsencrypt/live/ulalaapi.store/privkey.pem"

# Cert domain PPM (ppm-afm.com + www.ppm-afm.com), diterbitkan certbot
# standalone 6 Agu 2026. Perpanjangan otomatis memakai hook yang sudah ada:
# pre/10-stop-proxy.sh membebaskan :80, post/10-start-proxy.sh menyalakan
# kembali container — jadi proxy ikut restart dan membaca cert baru.
tls_cert_ppm: "/etc/letsencrypt/live/ppm-afm.com/fullchain.pem"
tls_key_ppm: "/etc/letsencrypt/live/ppm-afm.com/privkey.pem"

# ── CORS (hanya berlaku untuk ulalaapi.store /api/*) ──────────────────────────
cors_origins:
  - "https://ulala.space"
  - "https://www.ulala.space"
  - "https://image.ulalaapi.store"
  - "https://ui.ulalaapi.store"
  - "https://ppm-afm.com"

# ── Image cache ───────────────────────────────────────────────────────────────
image_cache_days: 30

# ── Rate limiting ─────────────────────────────────────────────────────────────
rate_limit_rps: 200

# ── Connection pool ───────────────────────────────────────────────────────────
upstream_pool_size: 64

# ── Dev origins (HANYA untuk development local) ───────────────────────────────
# Aktifkan saat dev, kosongkan atau hapus saat production deploy.
# Tidak ada overhead di production jika list kosong (Vec::iter().any() = false).
# Tambah port lain sesuai kebutuhan (Vite default 5173, CRA 3000, dll).
dev_origins:
  - "http://localhost:3000"
  - "http://77.237.242.1:3100"
  - "http://localhost:5173"
  - "http://localhost:4000"
  - "https://ulala.space"
  - "https://ppm-afm.com"
  # - "http://127.0.0.1:3000"  # uncomment jika pakai 127.0.0.1 bukan localhost
