[package]
name    = "kinetic-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
pingora      = { version = "0.8.0", features = ["lb", "openssl"] }
pingora-core = "0.8.0"
pingora-http = "0.8.0"
pingora-proxy = "0.8.0"
async-trait  = "0.1"
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_yaml   = "0.9"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes        = "1"
openssl      = "0.10"
http         = "1"
smol_str     = "0.3"
itoa         = "1"
dashmap      = "6"

[[bin]]
name = "kinetic-proxy"
path = "src/main.rs"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
